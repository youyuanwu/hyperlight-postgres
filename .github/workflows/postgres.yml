name: PostgreSQL build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HL_PG_BUILD_JOBS: "2"
  HL_PG_USE_SCCACHE: "1"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  postgres-build-16:
    uses: ./.github/workflows/postgres-build.yml
    with:
      pg: "16"

  postgres-build-17:
    uses: ./.github/workflows/postgres-build.yml
    with:
      pg: "17"

  postgres-build-18:
    uses: ./.github/workflows/postgres-build.yml
    with:
      pg: "18"

  postgres-build-19:
    uses: ./.github/workflows/postgres-build.yml
    with:
      pg: "19"

  hyperlight-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: pg16
    env:
      HL_PG_VERSION: "16"
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils bison build-essential cpio curl flex git m4 \
            musl-tools python3 util-linux

      - name: Check build prerequisites and fetch pinned sources
        run: make build-preflight fetch

      - name: Install upstream-pinned Rust toolchain
        working-directory: shared/target/sources/hyperlight-unikraft
        run: rustup toolchain install

      - name: Build runtime profiles and storage host
        run: make runtime-build pg-kernel storage-build

      - name: Bundle verified Hyperlight artifacts
        run: |
          tar -czf "$GITHUB_WORKSPACE/shared/target/hyperlight-build.tar.gz" \
            -C target/postgres-experiment \
            build.json hluk native-phase1 phase1.cpio \
            kernel-build/elfloader_hyperlight-x86_64 \
            phase2/kernel.json phase2/hluk phase2/pg-init \
            phase2/kernel-build/elfloader_hyperlight-x86_64 \
            phase3/host.json phase3/kernel.json phase3/storage-host \
            phase3/pg-init phase3/storage-probe \
            phase3/kernel-build/elfloader_hyperlight-x86_64

      - name: Upload Hyperlight artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hyperlight-build
          path: shared/target/hyperlight-build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Report compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

  assemble-and-test-16:
    needs: [postgres-build-16, hyperlight-build]
    uses: ./.github/workflows/postgres-test.yml
    with:
      pg: "16"

  assemble-and-test-17:
    needs: [postgres-build-17, hyperlight-build]
    uses: ./.github/workflows/postgres-test.yml
    with:
      pg: "17"

  assemble-and-test-18:
    needs: [postgres-build-18, hyperlight-build]
    uses: ./.github/workflows/postgres-test.yml
    with:
      pg: "18"

  assemble-and-test-19:
    needs: [postgres-build-19, hyperlight-build]
    uses: ./.github/workflows/postgres-test.yml
    with:
      pg: "19"
