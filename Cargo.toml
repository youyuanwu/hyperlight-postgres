[workspace]
members = ["shared/storage-host"]
exclude = ["shared/target/sources/hyperlight-unikraft"]
resolver = "3"

[workspace.dependencies]
hyperlight-unikraft = { path = "shared/target/sources/hyperlight-unikraft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
