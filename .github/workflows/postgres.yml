name: PostgreSQL build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HL_PG_BUILD_JOBS: "2"
  HL_PG_USE_SCCACHE: "1"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  postgres-build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    defaults:
      run:
        working-directory: pg${{ matrix.pg }}
    env:
      HL_PG_VERSION: ${{ matrix.pg }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils bison build-essential cpio curl flex git m4 \
            musl-tools python3 util-linux

      - name: Check build prerequisites and fetch pinned sources
        run: make build-preflight fetch

      - name: Build native and guest PostgreSQL and benchmark client
        run: make pg-native pg-guest benchmark-build

      - name: Bundle verified PostgreSQL artifacts
        run: |
          tar -czf "$GITHUB_WORKSPACE/pg${{ matrix.pg }}/target/postgres-build.tar.gz" \
            -C target/postgres-experiment \
            native-pg \
            postgres-native-build/experiment-inputs.json \
            postgres-native-build/src/include/pg_config.h \
            postgres-guest-build/experiment-inputs.json \
            postgres-guest-build/src/include/pg_config.h \
            phase2/guest-install phase5/query-client phase5/build.json

      - name: Upload PostgreSQL artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pg${{ matrix.pg }}-postgres-build
          path: pg${{ matrix.pg }}/target/postgres-build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Report compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

  hyperlight-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: pg16
    env:
      HL_PG_VERSION: "16"
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils bison build-essential cpio curl flex git m4 \
            musl-tools python3 util-linux

      - name: Check build prerequisites and fetch pinned sources
        run: make build-preflight fetch

      - name: Install upstream-pinned Rust toolchain
        working-directory: shared/target/sources/hyperlight-unikraft
        run: rustup toolchain install

      - name: Build runtime profiles and storage host
        run: make runtime-build pg-kernel storage-build

      - name: Bundle verified Hyperlight artifacts
        run: |
          tar -czf "$GITHUB_WORKSPACE/shared/target/hyperlight-build.tar.gz" \
            -C target/postgres-experiment \
            build.json hluk native-phase1 phase1.cpio \
            kernel-build/elfloader_hyperlight-x86_64 \
            phase2/kernel.json phase2/hluk phase2/pg-init \
            phase2/kernel-build/elfloader_hyperlight-x86_64 \
            phase3/host.json phase3/kernel.json phase3/storage-host \
            phase3/pg-init phase3/storage-probe \
            phase3/kernel-build/elfloader_hyperlight-x86_64

      - name: Upload Hyperlight artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hyperlight-build
          path: shared/target/hyperlight-build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Report compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

  assemble-and-test:
    needs: [postgres-build, hyperlight-build]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    defaults:
      run:
        working-directory: pg${{ matrix.pg }}
    env:
      HL_PG_VERSION: ${{ matrix.pg }}
      HL_PG_ARTIFACT_ONLY: "1"
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install test and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils cpio musl python3 util-linux

      - name: Check KVM and artifact validation prerequisites
        run: make preflight

      - name: Download PostgreSQL artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: pg${{ matrix.pg }}-postgres-build
          path: pg${{ matrix.pg }}/target/artifacts

      - name: Download Hyperlight artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: hyperlight-build
          path: pg${{ matrix.pg }}/target/artifacts

      - name: Restore executable artifacts and symlinks
        run: |
          tar -xzf target/artifacts/postgres-build.tar.gz \
            -C target/postgres-experiment --same-permissions --no-same-owner
          tar -xzf target/artifacts/hyperlight-build.tar.gz \
            -C target/postgres-experiment --same-permissions --no-same-owner

      - name: Assemble images and run all tests without rebuilding
        run: make validate-built

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pg${{ matrix.pg }}-failure-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            pg${{ matrix.pg }}/target/postgres-experiment/*.log
            pg${{ matrix.pg }}/target/postgres-experiment/*-results.json
            pg${{ matrix.pg }}/target/postgres-experiment/preflight.json
            pg${{ matrix.pg }}/target/postgres-experiment/phase*/**/*.log
            pg${{ matrix.pg }}/target/postgres-experiment/phase*/**/results.json
            pg${{ matrix.pg }}/target/postgres-experiment/read-benchmark/**/*.log
            pg${{ matrix.pg }}/target/postgres-experiment/read-benchmark/**/results.json
